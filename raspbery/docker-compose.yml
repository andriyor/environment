# Stacks live in stacks/; paths inside them stay relative to this folder (project_directory: .).
name: raspbery

include:
  - path: stacks/home.yml
    project_directory: .
  - path: stacks/media.yml
    project_directory: .
  - path: stacks/arr.yml
    project_directory: .
  - path: stacks/network.yml
    project_directory: .
  - path: stacks/monitoring.yml
    project_directory: .
  - path: stacks/files.yml
    project_directory: .
  - path: stacks/apps.yml
    project_directory: .
  - path: stacks/tools.yml
    project_directory: .
  - path: stacks/unused.yml
    project_directory: .
