services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host # Recommended for DNS to work reliably
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Kyiv

  gatus:
    container_name: gatus
    image: ghcr.io/twin/gatus:stable
    ports:
      - "8090:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./data:/data/
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
    restart: unless-stopped

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    network_mode: host
    privileged: true

  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    network_mode: host
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./matter:/data
    command: --primary-interface eth0

  blog:
    container_name: blog
    build:
      context: https://github.com/andriyor/blog.git#ceeb7fecd06c3539f984b852df43cfb60eb1ea1a
    ports:
      - "8080:80"
    restart: unless-stopped

  airtable:
    container_name: airtable-wrapper
    build:
      context: https://github.com/andriyor/airtable-wrapper.git#main
    ports:
      - "8000:80"
    volumes:
      - ./app:/app/app:rw,cached # live reload
      - ./airtable/database.db:/app/database.db
    environment:
      - AIRTABLE_API=${AIRTABLE_API}
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
    volumes:
      - ./jellyfin-config:/config
      - /mnt/storage:/media
    ports:
      - 8096:8096
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000 # Run 'id' in terminal to check your UID
      - PGID=1000 # Run 'id' in terminal to check your GID
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent-config:/config
      - /mnt/storage:/data
      - /mnt/nas_data:/ndata
    ports:
      - 8095:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    ## If you intend to use stash's DLNA functionality uncomment the below network mode and comment out the above ports section
    # network_mode: host
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Adjust below paths (the left part) to your liking.
      ## E.g. you can change ./config:/root/.stash to ./stash:/root/.stash
      ## The left part is the path on your host, the right part is the path in the stash container.

      ## Keep configs, scrapers, and plugins here.
      - ./stash-config:/root/.stash
      ## Point this at your collection.
      ## The left side is where your collection is on your host, the right side is where it will be in stash.
      - /mnt/nas_data:/data
      ## This is where your stash's metadata lives
      - ./metadata:/metadata
      ## Any other cache content.
      - ./cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - ./blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - ./stash-generated:/generated

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./radarr/data:/config
      - /mnt/storage:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./prowlarr-config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # gtsteffaniak/filebrowser (FileBrowser Quantum), not the original filebrowser/filebrowser
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    # image defaults to uid 1000; root is needed for full read/write on the /host source
    user: "0:0"
    ports:
      - 9090:80
    volumes:
      - ./filebrowser:/home/filebrowser/data # config.yaml + database.db
      # mounted at the same paths as on the host, so config.yaml sources match
      - /mnt/storage:/mnt/storage
      - /mnt/nas_data:/mnt/nas_data
      - /:/host # the pi's filesystem, browsable but not indexed (see config.yaml)
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    restart: unless-stopped

  # nxzai/NextExplorer — trial, running next to filebrowser for comparison.
  # No config file: everything is env vars. Each /mnt/<Label> becomes a UI volume.
  # Missing vs filebrowser as of 2.2.7: no persistent index (search re-runs ripgrep
  # in the current folder each time) and no recursive folder sizes (listings report
  # the raw dir stat, 4096). Tracked upstream in nxzai/NextExplorer#301, expected in
  # a later release — recheck on upgrade, then drop this note.
  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    ports:
      - 8083:3000
    volumes:
      - ./nextexplorer/config:/config # sqlite db, app-config.json, settings
      - ./nextexplorer/cache:/cache # thumbnails + sessions.db, safe to wipe
      - /mnt/storage:/mnt/Storage
      - /mnt/nas_data:/mnt/Nas
    environment:
      - PUBLIC_URL=http://192.168.1.65:8083 # canonical origin, used for share links
      # other origins it may be reached from, else a mismatch warning on open
      - INTERNAL_URL=http://raspberrypi:8083,http://raspberrypi.local:8083,http://localhost:8083
      - SESSION_SECRET=${NEXTEXPLORER_SESSION_SECRET} # else logout on every restart
      - PUID=0 # root, same reason as filebrowser above
      - PGID=0
      - AUTH_MODE=local
      - AUTH_ADMIN_EMAIL=admin@local.lan # skips the setup wizard
      - AUTH_ADMIN_PASSWORD=${NEXTEXPLORER_ADMIN_PASSWORD}
      - TERMINAL_ENABLED=false # defaults to true = root shell in the browser
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Tashkent
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ./seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - 8084:8084
    restart: unless-stopped
    volumes:
      - /mnt/storage/books:/books # Default destination for book downloads
      - /shelfmark:/config # App configuration
      # Required for torrent / usenet - path must match your download client'

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=http://localhost:9099
    ports:
      - "9099:8090"
    volumes:
      - ./beszel_data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: http://localhost:9099

  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    ports:
      - "5000:5000"
    volumes:
      - /mnt/storage/books:/manga
      - ./kavita:/kavita/config
    environment:
      - TZ=Your/Timezone
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./bazarr-config:/config
      - /mnt/storage/movies:/data/movies
    ports:
      - 6767:6767
    restart: unless-stopped
    
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    ports:
      - "8191:8191"
    volumes:
      - /var/lib/flaresolver:/config
    restart: unless-stopped

  mtproto-proxy:
    image: ghcr.io/telemt/telemt:latest
    restart: unless-stopped
    ports:
      - "3128:3128"
    volumes:
      - ./telemt-config.toml:/app/config.toml
      - telemt-data:/app
    command: ["/app/config.toml"]

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=homeassistant
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    restart: unless-stopped

  ezbookkeeping:
    image: mayswind/ezbookkeeping:latest
    container_name: ezbookkeeping
    ports:
      - 8082:8080
    volumes:
      - ./ezbookkeeping/data:/ezbookkeeping/data
      - ./ezbookkeeping/log:/ezbookkeeping/log
      - ./ezbookkeeping/storage:/ezbookkeeping/storage
    environment:
      - TZ=Europe/Kyiv
      # sqlite3 is the default; db file lands in the ./ezbookkeeping/data mount
      - EBK_DATABASE_TYPE=sqlite3
      - EBK_DATABASE_DB_PATH=data/ezbookkeeping.db
      # must match the published host port so generated links/redirects work
      - EBK_SERVER_ROOT_URL=http://192.168.1.65:8082/
      - EBK_SECURITY_SECRET_KEY=${EZBOOKKEEPING_SECRET_KEY}
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
    volumes:
      - ./lidarr-config:/config
      - /mnt/storage/music:/music
      - /mnt/storage/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped

volumes:
  telemt-data:
  grafana_data:
