# Status pages and host monitoring
services:
  # Uptime / health-check status page for the services here (checks in config.yaml)
  gatus:
    container_name: gatus
    image: ghcr.io/twin/gatus:stable
    ports:
      - "8090:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./data:/data/
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
    restart: unless-stopped

  # Server monitoring hub (CPU, RAM, disk, containers)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=http://localhost:9099
    ports:
      - "9099:8090"
    volumes:
      - ./beszel_data:/beszel_data

  # Beszel agent reporting this Pi's metrics to the hub
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: http://localhost:9099
