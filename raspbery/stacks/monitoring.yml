# Status pages and host monitoring
services:
  # Uptime / health-check status page for the services here (checks in config.yaml)
  gatus:
    container_name: gatus
    image: ghcr.io/twin/gatus:stable
    ports:
      - "8090:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./data:/data/
    environment:
      - GATUS_CONFIG_PATH=/config/config.yaml
    restart: unless-stopped

  # Server monitoring hub (CPU, RAM, disk, containers)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=http://localhost:9099
    ports:
      - "9099:8090"
    volumes:
      - ./beszel_data:/beszel_data

  # Beszel agent reporting this Pi's metrics to the hub
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      # extra disks: mount any folder on the disk as /extra-filesystems/<kname>__<label>;
      # <kname> (lsblk KNAME) matches /proc/diskstats for I/O stats, rename if sdX shifts
      - /mnt/storage/.beszel:/extra-filesystems/sdc1__Storage:ro
      - /mnt/nas_data/.beszel:/extra-filesystems/sdd1__NAS:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: http://localhost:9099
