# Own apps, built from andriyor/* repos
services:
  # Personal blog, built from andriyor/blog
  blog:
    container_name: blog
    build:
      context: https://github.com/andriyor/blog.git#main
    ports:
      - "8080:80"
    restart: unless-stopped

  # Custom wrapper around the Airtable API, built from andriyor/airtable-wrapper
  airtable:
    container_name: airtable-wrapper
    build:
      context: https://github.com/andriyor/airtable-wrapper.git#main
    ports:
      - "8000:80"
    volumes:
      - ./app:/app/app:rw,cached # live reload
      - ./airtable/database.db:/app/database.db
    environment:
      - AIRTABLE_API=${AIRTABLE_API}
    restart: unless-stopped

  # Toggl timer on the iPhone Lock Screen (Live Activity via APNs); the app reports to :8790
  toggl-lock:
    container_name: toggl-lock
    build:
      context: https://github.com/andriyor/toggl-lock.git#master:server
    env_file: ./toggl-lock/.env # APNs + Toggl settings, see server/.env.example
    environment:
      - APNS_KEY_PATH=/key.p8
    volumes:
      - ./toggl-lock/AuthKey.p8:/key.p8:ro
      - ./toggl-lock/data:/data # state.json
    ports:
      - 8790:8790
      - 8788:8788 # Toggl webhook; tunnel toggl-hook.oreh.uk → localhost:8788
    restart: unless-stopped

  # Toggl tracker UI (Vite dev server, proxies the Toggl API with TOGGL_TOKEN).
  # Plain HTTP. GET /api/selected-tags
  # returns the tags picked in the UI, saved to ./toggl-wrapper/data.
  toggl-wrapper:
    container_name: toggl-wrapper
    build:
      context: https://github.com/andriyor/toggl-wrapper.git#master
    ports:
      - 5173:5173
    environment:
      - TOGGL_TOKEN=${TOGGL_TOKEN}
    volumes:
      - ./toggl-wrapper/data:/app/data
    restart: unless-stopped

  # Runway Budget: balances, runway and Monobank spending, built from andriyor/runway-budget.
  # One container: the API serves the web app at / and its routes under /api.
  # ./runway-budget/.env holds MONO_TOKEN and MONO_ACCOUNT (synced at 09:00 and 21:00);
  # SQLite lives in ./runway-budget/data.
  runway:
    container_name: runway
    build:
      context: https://github.com/andriyor/runway-budget.git#main
    env_file: ./runway-budget/.env
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - ./runway-budget/data:/data
    ports:
      - "8087:3000"
    restart: unless-stopped

  # Archivegram: archives friends' Instagram stories, built from andriyor/archivegram (private, so
  # from a local clone in ./archivegram/src; see README "Archivegram"). One container: the API serves
  # the web app at /. ./archivegram/.env holds INSTAGRAM_USERNAME; the Instaloader session is in
  # ./archivegram/instaloader; database, stories and profile pictures live in ./archivegram/data.
  archivegram:
    container_name: archivegram
    build: ./archivegram/src
    env_file: ./archivegram/.env
    environment:
      - TZ=Europe/Kyiv # stories are grouped by local day
    volumes:
      - ./archivegram/data:/app/api/data
      - ./archivegram/instaloader:/home/app/.config/instaloader:ro
    ports:
      - "8088:8000"
    restart: unless-stopped
