# Third-party self-hosted tools
services:
  # Personal finance / expense tracker
  ezbookkeeping:
    image: mayswind/ezbookkeeping:latest
    container_name: ezbookkeeping
    ports:
      - 8082:8080
    volumes:
      - ./ezbookkeeping/data:/ezbookkeeping/data
      - ./ezbookkeeping/log:/ezbookkeeping/log
      - ./ezbookkeeping/storage:/ezbookkeeping/storage
    environment:
      - TZ=Europe/Kyiv
      # sqlite3 is the default; db file lands in the ./ezbookkeeping/data mount
      - EBK_DATABASE_TYPE=sqlite3
      - EBK_DATABASE_DB_PATH=data/ezbookkeeping.db
      # must match the published host port so generated links/redirects work
      - EBK_SERVER_ROOT_URL=http://192.168.1.65:8082/
      - EBK_SECURITY_SECRET_KEY=${EZBOOKKEEPING_SECRET_KEY}
    restart: unless-stopped

  # Bookmark manager, no chrome (plain HTTP crawling, no screenshots).
  # Built-in backups skip assets; back up ./karakeep/data for a full copy
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    ports:
      - 3002:3000 # 3000 is grafana
    volumes:
      - ./karakeep/data:/data
    environment:
      - DATA_DIR=/data
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY}
      # must match the published host port so generated links/redirects work
      - NEXTAUTH_URL=http://192.168.1.65:3002
      - NEXTAUTH_SECRET=${KARAKEEP_NEXTAUTH_SECRET}
      - DISABLE_SIGNUPS=true
    restart: unless-stopped

  # Karakeep search index, can be rebuilt from the app
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.55.0
    container_name: karakeep-meilisearch
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - ./karakeep/meilisearch:/meili_data
    restart: unless-stopped
