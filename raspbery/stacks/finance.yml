# Finance: keepard (sars/keepard), self-hosted spending tracker with monobank import.
# Config and credentials live in ./keepard/config, mounted read-only as
# /etc/private-finances, the path keepard reads. Setup: README "Keepard".
x-keepard: &keepard
  image: keepard:local
  user: "${KEEPARD_UID:-1000}:${KEEPARD_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file: ./keepard/config/app.env
  environment:
    CREDENTIALS_DIRECTORY: /etc/private-finances/credentials
    ENABLEBANKING_SESSION_DIRECTORY: /var/lib/private-finances-consent
  volumes:
    - ./keepard/config:/etc/private-finances:ro
    - ./keepard/state/consent:/var/lib/private-finances-consent
  depends_on:
    keepard-db:
      condition: service_healthy
  restart: unless-stopped

services:
  keepard-db:
    container_name: keepard-db
    image: postgres:16
    env_file: ./keepard/config/db.env # POSTGRES_PASSWORD, same as in DATABASE_URL
    environment:
      POSTGRES_USER: private-finances
      POSTGRES_DB: private_finances
    volumes:
      - keepard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private-finances -d private_finances"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Dashboard, built from the lan-hosts branch of my fork: LAN_HOSTS in app.env
  # lets it run on http://192.168.1.65:3300; upstream accepts only localhost or HTTPS.
  keepard:
    <<: *keepard
    container_name: keepard
    build:
      context: https://github.com/andriyor/keepard.git#lan-hosts
    environment:
      APP_MODE: postgres
      PORT: "3300"
      BIND_ADDRESS: 0.0.0.0
      CREDENTIALS_DIRECTORY: /etc/private-finances/credentials
      ENABLEBANKING_SESSION_DIRECTORY: /var/lib/private-finances-consent
    ports:
      - "3300:3300"

  # Replaces upstream's systemd timers: monobank import every hour (upstream: 6h
  # after the previous run) and exchange rates 4 times a day for the display currency.
  # ponytail: one fixed instance, add monobank-katya here for a second member.
  keepard-sync:
    <<: *keepard
    container_name: keepard-sync
    pull_policy: never # keepard:local is built by the keepard service
    healthcheck:
      disable: true
    volumes:
      - ./keepard/config:/etc/private-finances:ro
      - ./keepard/state/consent:/var/lib/private-finances-consent
      - ./keepard/state/sync:/var/lib/private-finances-sync
    command:
      - sh
      - -c
      - |
        while :; do
          node dist/src/schedule.js monobank-rodion
          [ $(( $(date -u +%H) % 6 )) -eq 5 ] && node dist/src/fx-sync-cli.js
          sleep 3600
        done

  # Firefly III v6.7.9 with the dashboard currency switcher from my fork
  # (andriyor/firefly-iii, branch currency-switch) copied over the release image.
  # ponytail: overlays 3 files on a pinned release; rebase the branch before bumping the tag.
  firefly:
    container_name: firefly
    image: firefly:currency-switch
    build:
      context: ./firefly
      dockerfile_inline: |
        FROM fireflyiii/core:version-6.7.9
        ARG SRC=https://raw.githubusercontent.com/andriyor/firefly-iii/currency-switch
        ADD --chown=www-data:www-data --chmod=644 $${SRC}/app/Http/Controllers/HomeController.php /var/www/html/app/Http/Controllers/HomeController.php
        ADD --chown=www-data:www-data --chmod=644 $${SRC}/resources/views/index.blade.php /var/www/html/resources/views/index.blade.php
        ADD --chown=www-data:www-data --chmod=644 $${SRC}/resources/lang/en_US/firefly.php /var/www/html/resources/lang/en_US/firefly.php
    stop_signal: SIGINT
    env_file: ./firefly/.env
    volumes:
      - firefly-upload:/var/www/html/storage/upload
      - firefly-database:/var/www/html/storage/database # SQLite
    ports:
      - "8085:8080"
    restart: unless-stopped

  # Daily cron call: recurring transactions, exchange-rate downloads.
  firefly-cron:
    container_name: firefly-cron
    image: alpine
    env_file: ./firefly/.env
    init: true
    command:
      - sh
      - -c
      - >-
        apk add tzdata && (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) &&
        echo "0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo" | crontab - &&
        exec crond -f -L /dev/stdout
    depends_on:
      - firefly
    restart: unless-stopped

volumes:
  keepard-pgdata:
  firefly-upload:
  firefly-database:
