- id: '1780832399613'
  alias: ups - battery telegram
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.ups_battery
    below: 35
  conditions: []
  actions:
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.ha_andriy_orehov
      message: low battery
  mode: single
- id: '1780832500001'
  alias: ups - power lost
  description: UPS switched to battery (mains/charger disconnected)
  triggers:
  - trigger: state
    entity_id:
    - sensor.ups_status
    to:
    - discharging
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions: []
  actions:
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.ha_andriy_orehov
      message: ⚡ Power lost — UPS on battery, {{ states('sensor.ups_battery') }}%
        remaining
  mode: single
- id: '1780832500002'
  alias: ups - power restored
  description: Mains/charger reconnected (status left discharging)
  triggers:
  - trigger: state
    entity_id:
    - sensor.ups_status
    from:
    - discharging
    to:
    - idle
    - charging
    - fast_charging
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions: []
  actions:
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.ha_andriy_orehov
      message: Power restored — UPS {{ states('sensor.ups_status') | replace('_',
        ' ') }} {{ states('sensor.ups_battery') }}%
  mode: single
