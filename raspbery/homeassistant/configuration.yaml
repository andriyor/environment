
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

rest_command:
  airtable_log:
    url: "https://api.airtable.com/v0/appeuWmWqkkoGjuQL/tblZGNXgyVU8ieHCo"
    method: POST
    headers:
      Authorization: !secret airtable_token
      Content-Type: "application/json"
    payload: >
      {"fields": {"Name": "Union Square", "date": "{{ now() }}"}}

input_select:
  energy_state:
    name: Energy state
    options:
      - active
      - sleepy
      - sleep
  neck_pain:
    name: Neck pain
    options:
      - good
      - slightly
      - unbearable

sensor:
  - platform: waveshare_ups_hat
    model: e                     # Waveshare UPS HAT (E), MCU @ 0x2d
    name: UPS                    # Optional
    unique_id: waveshare_ups     # Optional

  # kWh counters for the Energy dashboard (it needs energy, these sources are W).
  # left + max_sub_interval: the value holds until the next reading, and the
  # total keeps growing every 5 min even when the power reading doesn't change.
  # Pi: HAT input power, not "UPS Load Power" (that estimate goes negative).
  - platform: integration
    name: Pi Energy
    unique_id: pi_energy
    source: sensor.ups_vbus_power
    unit_prefix: k
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    name: Bluetti AC Out Energy
    unique_id: bluetti_ac_out_energy
    source: sensor.el100v22619120898693_alternating_current_out_power
    unit_prefix: k
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    name: Bluetti DC Out Energy
    unique_id: bluetti_dc_out_energy
    source: sensor.el100v22619120898693_direct_current_out_power
    unit_prefix: k
    method: left
    round: 3
    max_sub_interval:
      minutes: 5

template:
  - sensor:
      # Pi load = HAT input power minus power going into the battery.
      # On battery VBUS is 0 and battery current is negative, so this becomes
      # the discharge power. Ignores converter losses — an estimate.
      - name: "UPS Load Power"
        unique_id: ups_load_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.ups_vbus_power')
             and has_value('sensor.ups_battery_voltage')
             and has_value('sensor.ups_battery_current') }}
        state: >
          {% set vbus = states('sensor.ups_vbus_power') | float %}
          {% set bat = states('sensor.ups_battery_voltage') | float
                     * states('sensor.ups_battery_current') | float %}
          {{ (vbus - bat) | round(2) }}
