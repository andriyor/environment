# raspotify (librespot) settings, loaded by the systemd drop-in in
# /etc/systemd/system/raspotify.service.d/override.conf instead of /etc/raspotify/conf.
# Options: https://github.com/librespot-org/librespot/wiki/Options
# Flags without a value (e.g. LIBRESPOT_QUIET=) are enabled just by being set.
LIBRESPOT_BITRATE=320
LIBRESPOT_DEVICE=hw:CARD=IQaudIODAC,DEV=0
LIBRESPOT_DISABLE_AUDIO_CACHE=
LIBRESPOT_DISABLE_CREDENTIAL_CACHE=
LIBRESPOT_ENABLE_VOLUME_NORMALISATION=
LIBRESPOT_QUIET=
TMPDIR=/tmp
